[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lisjong-play"
version = "0.1.0"
description = "Human Play consumer for the lisjong ecosystem"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [{ name = "lisbun" }]
dependencies = [
    "lisjong @ git+https://github.com/lisbun/lisjong.git@2a9debebdbbe4d10841fa4371a6cf6bf19ce9de1",
    "lisjong-engine @ git+https://github.com/lisbun/lisjong-engine.git@8735e89e1aea000ab59368d0368d476787827741",
    "lisjong-arena @ git+https://github.com/lisbun/lisjong-arena.git@fe3f349a30e5c31c21d314a5025e53fae0b19a03",
]

[project.optional-dependencies]
dev = ["ruff==0.16.0"]

[project.scripts]
lisjong-play = "lisjong_play.cli:main"
lisjong-play-gui = "lisjong_play.gui:main"
lisjong-play-replay = "lisjong_play.replay_gui:main"
lisjong-play-replay-html = "lisjong_play.replay_html:main"
lisjong-play-spectator = "lisjong_play.spectator_gui:main"
lisjong-play-riichilab = "lisjong_play.riichilab_gui:main"
lisjong-play-riichilab-html = "lisjong_play.riichilab_html:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lisjong_play = ["assets/tiles/*.png", "assets/tiles/*.md"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
