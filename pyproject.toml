[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lisjong-play"
version = "0.1.0"
description = "Human Play consumer for the lisjong ecosystem"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [{ name = "lisbun" }]
dependencies = [
    "lisjong @ git+https://github.com/lisbun/lisjong.git@d39abcd2f609e2d48c16e7ba3ec0d28f4b7a062d",
    "lisjong-engine @ git+https://github.com/lisbun/lisjong-engine.git@8735e89e1aea000ab59368d0368d476787827741",
    "lisjong-arena @ git+https://github.com/lisbun/lisjong-arena.git@e94a88a885772788d0fa27186c12a31fe471fee2",
]

[project.optional-dependencies]
dev = ["ruff==0.16.0"]

[project.scripts]
lisjong-play = "lisjong_play.cli:main"
lisjong-play-gui = "lisjong_play.gui:main"
lisjong-play-replay = "lisjong_play.replay_gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lisjong_play = ["assets/tiles/*.png", "assets/tiles/*.md"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
