[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lisjong-play"
version = "0.1.0"
description = "Human Play consumer for the lisjong ecosystem"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [{ name = "lisbun" }]
dependencies = [
    "lisjong @ git+https://github.com/lisbun/lisjong.git@84e905d252d65eb37b722f195f2774fd5661d5af",
    "lisjong-engine @ git+https://github.com/lisbun/lisjong-engine.git@8735e89e1aea000ab59368d0368d476787827741",
    "lisjong-arena @ git+https://github.com/lisbun/lisjong-arena.git@209ad2b28eeb65a71b6c561e6c025c719be19fef",
]

[project.optional-dependencies]
dev = ["ruff==0.16.0"]

[project.scripts]
lisjong-play = "lisjong_play.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
