[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lisjong-play"
version = "0.1.0"
description = "Human Play consumer for the lisjong ecosystem"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [{ name = "lisbun" }]
dependencies = [
    "lisjong @ git+https://github.com/lisbun/lisjong.git@1bc334b6d5df8089a408e80b89f691af0e9d1c80",
    "lisjong-engine @ git+https://github.com/lisbun/lisjong-engine.git@8735e89e1aea000ab59368d0368d476787827741",
    "lisjong-arena @ git+https://github.com/lisbun/lisjong-arena.git@ea67d76420b88b7f3a0e9c5221d93777453be44a",
]

[project.optional-dependencies]
dev = ["ruff==0.16.0"]

[project.scripts]
lisjong-play = "lisjong_play.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
